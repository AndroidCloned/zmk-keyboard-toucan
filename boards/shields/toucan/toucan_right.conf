CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# PM_DEVICE_RUNTIME suspends SPI between Cirque transfers on this board and
# has left the pad stuck; keep SYSTEM_MANAGED only.
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_PM_DEVICE_RUNTIME=n

CONFIG_BOOT_BANNER=n

# See cirque_deep_sleep.c — Sleep Enable on idle, SHUTDOWN before System OFF.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_PM_SOFT_OFF=y

# beekeeb#19
CONFIG_INPUT_THREAD_STACK_SIZE=2048
