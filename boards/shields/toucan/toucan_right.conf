CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Aggressive ASIC idle sleep (~300ms wake) still optional — leave off so
# trackpad feels instant; deep sleep + 30s ZMK idle cover most savings.
# CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Soft-off implies PM device suspend/resume (needed for Cirque).
CONFIG_ZMK_PM_SOFT_OFF=y
