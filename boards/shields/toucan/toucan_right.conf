CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Runtime PM parks SPI between Cirque transfers and can stick the pad here.
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y
CONFIG_PM_DEVICE_RUNTIME=n

CONFIG_BOOT_BANNER=n

# 5 min System OFF. Cirque: sensing while awake, SHUTDOWN before off,
# boot FORCE_WAKEUP, TX gated until split up.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_PM_SOFT_OFF=y

# beekeeb#19
CONFIG_INPUT_THREAD_STACK_SIZE=2048
