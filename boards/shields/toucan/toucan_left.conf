CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep sleep (sys_poweroff). Zephyr pm_device_slots hang is fixed on
# zmkfirmware/zephyr v4.1.0+zmk-fixes (reverts zephyr#69682 / zmk#3207).
CONFIG_ZMK_SLEEP=y
# 15 minutes → deep sleep (ZMK default). Shorter than prior 60m for better
# battery; features unchanged, just earlier poweroff when unused.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Idle after 30s (trackpad / radio power). Unchanged from Toucan defaults.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Soft-off implies PM device suspend/resume (needed for Cirque + display).
CONFIG_ZMK_PM_SOFT_OFF=y
