CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# Gem needs peripheral SoC events; do NOT proxy a second BAS to Windows (0% on split flap).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

CONFIG_BOOT_BANNER=n
CONFIG_BT_DIS_PNP=n

# Windows + Realtek USB dongle reconnect quirks (zmk.dev connection-issues).
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Windows BAS/notification quirk; helps flaky host stacks keep the link useful.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# Stronger advertising/connect for a sleepy Realtek USB radio.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 15 min System OFF. Prefer toucan_left_no_studio (Studio + sleep ≈ zmk#3195).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# beekeeb#19 — trackpad fan-out on central
CONFIG_INPUT_THREAD_STACK_SIZE=2048
