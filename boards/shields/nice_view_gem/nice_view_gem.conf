CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# 144×168 L8 canvas — default stack/pool are too small for gem.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=12288
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Pause ls0xx serial-VCOM thread while blanked (vcom_idle.c).
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
