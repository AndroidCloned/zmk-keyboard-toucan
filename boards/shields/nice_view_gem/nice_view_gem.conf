CONFIG_ZMK_DISPLAY=y
# Blank the Sharp panel on ZMK idle (30s) — stops VCOM SPI until activity.
# Biggest left-half idle battery win for toucan_left_no_studio.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Gem panel is 144x168 with a full-frame L8 canvas; default 3072 overflows and
# hard-faults during first paint (USB "device descriptor request failed").
# Upstream nice!view (68x68 tiles) uses 4096; gem needs more headroom.
# 12K after reports of mid-session freeze (layer label stuck, keys dead).
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=12288
CONFIG_LV_Z_MEM_POOL_SIZE=32768
