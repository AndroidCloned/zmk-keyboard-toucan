CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Gem panel is 144x168 with a full-frame L8 canvas; default 3072 overflows and
# hard-faults during first paint (USB "device descriptor request failed").
# Upstream nice!view (68x68 tiles) uses 4096; gem needs more headroom.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192